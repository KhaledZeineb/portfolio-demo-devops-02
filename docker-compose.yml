services:
  portfolio:
    image: zeinebkhaled/portfolio-demo-devops-02:${IMAGE_TAG:-latest}
    container_name: portfolio-demo-devops-02
    ports:
      - "3002:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
